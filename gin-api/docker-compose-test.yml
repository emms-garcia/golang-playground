services:
  testapi:
    build:
      context: .
      target: builder
    command: go test -v ./...
    container_name: gin_test_api
    environment:
      CONFIGS_PATH: /go/src/app/configs
      ENVIRONMENT: test
      # Set to "release" to avoid spamming the console.
      GIN_MODE: release
    depends_on:
      testdb:
        condition: service_healthy
    volumes:
      - ./:/go/src/app

  testdb:
    image: postgres:17
    container_name: gin_test_api_db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
